spring:
  application:
    name: syncpass-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:syncpass;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: 30000

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    mode: ${AUTH_MODE:local}
    cognito:
      issuer: ${COGNITO_ISSUER:}
      user-pool-id: ${AWS_COGNITO_USER_POOL_ID:}
      region: ${AWS_REGION:us-east-1}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:syncpass-api}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

aws:
  cognito:
    region: ${AWS_REGION:us-east-1}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:}
    client-id: ${AWS_COGNITO_CLIENT_ID:}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:}
  credentials:
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}

logging:
  level:
    cl.duoc.syncpass: ${LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:syncpass;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
app:
  auth:
    mode: local

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/syncpass}
    username: ${DATABASE_USER:syncpass}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}

---
spring:
  config:
    activate:
      on-profile: cognito
app:
  auth:
    mode: cognito
    cognito:
      issuer: ${COGNITO_ISSUER:}
      user-pool-id: ${AWS_COGNITO_USER_POOL_ID:}
      region: ${AWS_REGION:us-east-1}
aws:
  cognito:
    region: ${AWS_REGION:us-east-1}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:}
    client-id: ${AWS_COGNITO_CLIENT_ID:}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:}
